/* Score code coverage only under the subsystem DUT.  AMD VIP and testbench
 * implementation coverage would otherwise dominate the initial report. */
+tree tb_axi_dma_core_amd_vip.dut

/* The following modules are imported third-party implementation RTL.
 * Their behavior is checked at the subsystem boundary, but their structural
 * code coverage is not a closure target for this project.  Excluding them
 * also prevents their heavily parameterized line maps from corrupting the
 * VCS/URG V-2023.12-SP2 line shape database. */
begin line+cond+tgl+fsm+branch -module priority_encoder end
begin line+cond+tgl+fsm+branch -module arbiter end
begin line+cond+tgl+fsm+branch -module axis_register end
begin line+cond+tgl+fsm+branch -module axis_fifo end
begin line+cond+tgl+fsm+branch -module axis_switch end
begin line+cond+tgl+fsm+branch -module axi_register_rd end
begin line+cond+tgl+fsm+branch -module axi_register_wr end
begin line+cond+tgl+fsm+branch -module axil_register_rd end
begin line+cond+tgl+fsm+branch -module axil_register_wr end
begin line+cond+tgl+fsm+branch -module axi_crossbar_addr end
begin line+cond+tgl+fsm+branch -module axi_crossbar_rd end
begin line+cond+tgl+fsm+branch -module axi_crossbar_wr end
begin line+cond+tgl+fsm+branch -module axi_crossbar end
begin line+cond+tgl+fsm+branch -module axil_crossbar_addr end
begin line+cond+tgl+fsm+branch -module axil_crossbar_rd end
begin line+cond+tgl+fsm+branch -module axil_crossbar_wr end
begin line+cond+tgl+fsm+branch -module axil_crossbar end
begin line+cond+tgl+fsm+branch -module axi_dma_rd end
begin line+cond+tgl+fsm+branch -module axi_dma_wr end
begin line+cond+tgl+fsm+branch -module axi_dma end
